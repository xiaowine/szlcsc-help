name: Deploy to GitHub Pages

on:
  schedule:
    # 每月1-7号每天10点运行一次
    - cron: "0 2 1-7 * *" # 10 AM China Standard Time (CST, UTC+8)
    # 每周二和周五运行一次
    - cron: "0 2 * * 2,5" # 10 AM China Standard Time (CST, UTC+8)
  push:
    branches: [master, test]
  workflow_dispatch: # Manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE_HOST: szlcsc-help.xiaowine.cc
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Prepare public directory
        run: |
          mkdir -p public
          echo "$SITE_HOST" > public/CNAME
          echo "SITE_URL=https://${SITE_HOST}" >> "$GITHUB_ENV"

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch coupon data
        run: pnpm run fetch

      - name: Generate sitemap
        run: pnpm run sitemap

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Vue project
        run: pnpm build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: html/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
